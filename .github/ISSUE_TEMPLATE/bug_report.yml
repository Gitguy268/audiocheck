name: Bug report
description: A wrong verdict, or something that does not work as described
title: ''
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        **If this looks like a security problem, do not report it here.** Follow
        [SECURITY.md](https://github.com/Gitguy268/audiocheck/blob/HEAD/SECURITY.md)
        instead.

        Please do not attach copyrighted music. A screenshot of the spectrogram
        and the findings is usually enough.

  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What did you do, what did audiocheck say, and what did you expect?
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: The file
      description: Format, sample rate and bit depth, and how it was made if you know.
      placeholder: FLAC, 44.1 kHz, 16-bit, ripped from CD with EAC
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      description: The exact build, not just the name. "Firefox 145.0.2" rather than "Firefox".
      placeholder: Brave 1.84 on macOS
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Anything in the browser console?
      description: Open DevTools, reproduce it, and paste anything red.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send this
      options:
        - label: I searched the open and closed issues for this.
